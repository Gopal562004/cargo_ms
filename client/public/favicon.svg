  <rect width="64" height="64" rx="14" fill="#4f46e5" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#6366f1" stroke-opacity="0.4" />
  
  <!-- Crisp Package Isometric Box Icon -->
  <g transform="translate(14, 14)" stroke="white" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lucide Package paths scaled to 36x36 -->
