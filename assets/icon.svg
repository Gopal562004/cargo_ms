<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Top Highlight Border Gradient -->
    <linearGradient id="rimBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter for Desktop Depth -->
    <filter id="appShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.35" />
    </filter>

    <!-- Inner Package Glow -->
    <filter id="packageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle (Subtle enterprise rounding, 160px radius on 1024px) -->
  <rect
    x="80"
    y="80"
    width="864"
    height="864"
    rx="180"
    ry="180"
    fill="url(#bgGradient)"
    filter="url(#appShadow)"
  />

  <!-- Subtle Rim Light Inner Stroke -->
  <rect
    x="82"
    y="82"
    width="860"
    height="860"
    rx="178"
    ry="178"
    fill="none"
    stroke="url(#rimBorder)"
    stroke-width="4"
  />

  <!-- CargoMS Official Isometric Package Geometry (Identical to BrandLogo) -->
  <g transform="translate(512, 512) scale(23) translate(-12, -12)" filter="url(#packageGlow)">
    <!-- Outer 3D Hexagonal Box -->
    <path
      d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.85"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Vertical Fold Spine -->
    <path
      d="M12 22V12"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.85"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Top Flaps Crease -->
    <polyline
      points="3.29 7 12 12 20.71 7"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.85"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Top Tape Diagonal Strip -->
    <path
      d="m7.5 4.27 9 5.15"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.85"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
