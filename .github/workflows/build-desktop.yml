name: Build & Release CargoMS Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd client && npm install
          cd ../server && npm install

      - name: Build React Client
        run: |
          cd client && npm run build
        env:
          ELECTRON_BUILD: "true"

      - name: Generate Desktop Prisma SQLite Client
        run: |
          cd server && npx prisma generate --schema=prisma/schema.desktop.prisma

      - name: Build Electron App
        run: |
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
