name: Build & Release CargoMS Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd client && npm install
          cd ../server && npm install

      - name: Build React Client
        run: |
          cd client && npm run build
        env:
          ELECTRON_BUILD: "true"

      - name: Generate Desktop Prisma SQLite Client & Pre-seed Database
        run: |
          cd server
          npx prisma generate --schema=prisma/schema.desktop.prisma
          npx prisma db push --schema=prisma/schema.desktop.prisma --accept-data-loss
          node prisma/seed-desktop.js
        env:
          DESKTOP_DATABASE_URL: "file:./desktop.db"

      - name: Build Electron App
        run: |
          npx electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: CargoMS Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            dist-electron/CargoMS-Desktop-Setup-*.exe
            dist-electron/CargoMS-Desktop-*.exe
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

